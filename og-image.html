<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image · BION SportsFest '26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #10201a;
    --ink-2: #4e635a;
    --paper: #f3f5f0;
    --court: #1b4a38;
    --lime: #a8db3c;
    --line: #e0e5dc;

    --display: 'Archivo', system-ui, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    overflow: hidden;
    font-family: var(--display);
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
  }

  /* ===== Outlined sport-icon backdrop ===== */
  .icons {
    position: absolute;
    inset: 0;
    color: var(--court);
    opacity: 0.16;
  }
  .icons svg {
    position: absolute;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ===== Frame ===== */
  .frame {
    position: absolute;
    inset: 22px;
    border: 2px solid var(--ink);
    border-radius: 20px;
  }

  /* ===== Content ===== */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .logo { height: 120px; width: auto; display: block; margin-bottom: 26px; }

  h1 {
    font-family: var(--display);
    font-variation-settings: 'wdth' 125, 'wght' 800;
    font-size: 92px;
    line-height: 0.86;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }

  h1 i { font-style: normal; color: var(--lime); }

</style>
</head>
<body>
<div class="stage">

  <div class="icons" id="icons"></div>

  <div class="frame"></div>

  <div class="content">
    <img class="logo" src="bion-logo.png" alt="Bollineni Bion">
    <h1>SportsFest <i>&rsquo;26</i></h1>
  </div>

</div>

<script>
  // ---- Outline sport icons, viewBox 0 0 24 24, stroke=currentColor ----
  const SPORTS = {
    badminton: `<circle cx="9" cy="9" r="6.4"/><path d="M9 2.6v12.8M2.6 9h12.8M4.5 4.5l9 9M13.5 4.5l-9 9"/><path d="M15.5 15.5l6 6"/><path d="M20 19l2.4 2.4-1 1L19 20z"/>`,
    tabletennis: `<rect x="2" y="2" width="12" height="15" rx="6" transform="rotate(-25 8 9)"/><circle cx="18.5" cy="18.5" r="2.6"/>`,
    chess: `<circle cx="12" cy="6.5" r="2.6"/><path d="M8.4 12.5h7.2l1.6 7.5H6.8z"/><path d="M6 21.5h12"/>`,
    caroms: `<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="4.8" r="1.3"/><circle cx="19.2" cy="12" r="1.3"/><circle cx="12" cy="19.2" r="1.3"/><circle cx="4.8" cy="12" r="1.3"/>`,
    pickleball: `<rect x="2.5" y="1.5" width="11" height="14.5" rx="5.5" transform="rotate(-20 8 8)"/><circle cx="4.5" cy="6" r="0.7"/><circle cx="7.5" cy="5" r="0.7"/><circle cx="10" cy="7" r="0.7"/><circle cx="6" cy="9" r="0.7"/><circle cx="9" cy="10.5" r="0.7"/><circle cx="19" cy="19" r="3.2"/>`,
    basketball: `<circle cx="12" cy="12" r="9.4"/><path d="M2.6 12h18.8M12 2.6v18.8"/><path d="M5 5.3c2.6 3 2.6 10.4 0 13.4M19 5.3c-2.6 3-2.6 10.4 0 13.4"/>`,
    lawntennis: `<ellipse cx="9" cy="8" rx="6.6" ry="7.6" transform="rotate(-18 9 8)"/><path d="M9 8v0" /><path d="M3 4c4 3 8 9 8 9M15 4c-4 3-8 9-8 9" opacity="0"/><path d="M4.5 15.5l7.2 7.2M15.5 15.5l6 6"/><path d="M18.5 18.5l3 3"/><circle cx="20" cy="20" r="0"/>`,
    squash: `<ellipse cx="9" cy="8" rx="5" ry="7" transform="rotate(-10 9 8)"/><path d="M9 15v6"/><circle cx="19.5" cy="4.5" r="1.7"/>`,
    swimming: `<circle cx="18.5" cy="5" r="1.8"/><path d="M2 10c1.6 1.6 3.2 1.6 4.8 0s3.2-1.6 4.8 0 3.2 1.6 4.8 0 3.2-1.6 4.8 0"/><path d="M2 14.6c1.6 1.6 3.2 1.6 4.8 0s3.2-1.6 4.8 0 3.2 1.6 4.8 0 3.2-1.6 4.8 0"/><path d="M2 19.2c1.6 1.6 3.2 1.6 4.8 0s3.2-1.6 4.8 0 3.2 1.6 4.8 0 3.2-1.6 4.8 0"/>`,
  };

  const keys = Object.keys(SPORTS);
  const wrap = document.getElementById('icons');

  // Deterministic pseudo-random scatter (fixed seed so re-renders are stable).
  let seed = 42;
  function rnd() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  const COLS = 8, ROWS = 5;
  const cellW = 1200 / COLS, cellH = 630 / ROWS;
  let i = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = keys[i % keys.length];
      i++;
      const size = 46 + rnd() * 30;
      const jitterX = (rnd() - 0.5) * cellW * 0.5;
      const jitterY = (rnd() - 0.5) * cellH * 0.5;
      const x = c * cellW + cellW / 2 - size / 2 + jitterX;
      const y = r * cellH + cellH / 2 - size / 2 + jitterY;
      const rot = (rnd() - 0.5) * 40;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.style.left = `${x}px`;
      svg.style.top = `${y}px`;
      svg.style.transform = `rotate(${rot}deg)`;
      svg.innerHTML = SPORTS[key];
      wrap.appendChild(svg);
    }
  }
</script>
</body>
</html>
