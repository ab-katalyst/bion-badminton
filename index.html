<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BION SportsFest '26</title>
  <meta name="description" content="Champions and runners-up from every event at Bollineni Bion SportsFest '26.">
  <link rel="icon" href="bion-favicon.png">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BION SportsFest '26">
  <meta property="og:title" content="BION SportsFest '26">
  <meta property="og:description" content="Champions and runners-up from every event at Bollineni Bion SportsFest '26.">
  <meta property="og:image" content="https://bion-community.pages.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://bion-community.pages.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BION SportsFest '26">
  <meta name="twitter:description" content="Champions and runners-up from every event at Bollineni Bion SportsFest '26.">
  <meta name="twitter:image" content="https://bion-community.pages.dev/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/sportsfest.css">
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" aria-label="Bollineni Bion, home"><img src="bion-logo.png" alt="Bollineni Bion"></a>
      <!-- Home, Past Events and Volunteers stay out of the nav — the logo is
           the way home, volunteers are a tab. -->
      <nav>
        <a href="https://tally.so/r/XxAorO" target="_blank" rel="noopener">Feedback</a>
        <a href="https://wa.me/917259509827?text=Hi%2C%20I%27d%20like%20to%20report%20an%20issue%20with%20the%20SportsFest%20%2726%20site." target="_blank" rel="noopener">Report Issue</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow">Bollineni Bion</p>
      <h1>SportsFest <i>'26</i></h1>
      <div class="tally" id="tally"></div>
    </section>

    <nav class="tabs" aria-label="Age categories">
      <div class="wrap" id="tabs" role="tablist"></div>
    </nav>

    <div class="wrap">
      <div class="panel-head" id="panel-head"></div>
      <div class="grid" id="grid" role="tabpanel"></div>
    </div>
  </main>

  <template id="financials-panel">
    <section aria-labelledby="summary-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">At a glance</p>
          <h2 id="summary-title">Sponsor summary</h2>
        </div>
        <p>Amounts shown are the actual event-use costs, including the shuttle adjustment noted below.</p>
      </div>

      <div class="finance-totals">
        <article class="total-card total-card--grand">
          <p>Grand total</p>
          <strong>₹8,788.75</strong>
          <span>All considered event expenses</span>
        </article>
        <article class="total-card">
          <p>BION Management</p>
          <strong>₹6,598.75</strong>
          <span>Medals, sports items, carrom set and lemon &amp; spoon</span>
        </article>
        <article class="total-card">
          <p>Badminton Team</p>
          <strong>₹2,190.00</strong>
          <span>Two shuttle tubes used for the event</span>
        </article>
      </div>
    </section>

    <section class="finance-section" aria-labelledby="expenses-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Cost ledger</p>
          <h2 id="expenses-title">Expense details</h2>
        </div>
        <p>The considered amount is used for sponsor totals, even when a bill's full value differs.</p>
      </div>

      <div class="finance-table-wrap" role="region" aria-label="SportsFest expense breakdown" tabindex="0">
        <table class="finance-table">
          <thead>
            <tr>
              <th scope="col">Expense</th>
              <th scope="col">Calculation</th>
              <th scope="col">Considered</th>
              <th scope="col">Sponsored by</th>
              <th scope="col">Reference</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-label="Expense">Medals</td>
              <td data-label="Calculation">130 × ₹34</td>
              <td data-label="Considered" class="money">₹4,420.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Medals bill</td>
            </tr>
            <tr class="adjusted-row">
              <td data-label="Expense">Yonex Mavis 350 shuttle tubes <span class="adjusted-tag">Adjusted</span></td>
              <td data-label="Calculation">2 used × ₹1,095</td>
              <td data-label="Considered" class="money">₹2,190.00</td>
              <td data-label="Sponsored by"><span class="sponsor sponsor--team">Badminton Team</span></td>
              <td data-label="Reference">Sachdev Sports bill</td>
            </tr>
            <tr>
              <td data-label="Expense">Wilson Championship tennis balls</td>
              <td data-label="Calculation">2 × ₹425</td>
              <td data-label="Considered" class="money">₹850.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Sachdev Sports bill</td>
            </tr>
            <tr>
              <td data-label="Expense">Tennikoit rings</td>
              <td data-label="Calculation">Bill amount</td>
              <td data-label="Considered" class="money">₹170.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Sachdev Sports bill</td>
            </tr>
            <tr>
              <td data-label="Expense">Stag 1-star orange TT balls</td>
              <td data-label="Calculation">Bill amount</td>
              <td data-label="Considered" class="money">₹204.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Sachdev Sports bill</td>
            </tr>
            <tr>
              <td data-label="Expense">Dunlop single-dot squash ball</td>
              <td data-label="Calculation">Bill amount</td>
              <td data-label="Considered" class="money">₹267.75</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Sachdev Sports bill</td>
            </tr>
            <tr>
              <td data-label="Expense">Carrom coin, striker &amp; powder set</td>
              <td data-label="Calculation">Invoice value</td>
              <td data-label="Considered" class="money">₹192.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">Zepto invoice</td>
            </tr>
            <tr>
              <td data-label="Expense">Lemon &amp; spoon game</td>
              <td data-label="Calculation">Reported expense</td>
              <td data-label="Considered" class="money">₹495.00</td>
              <td data-label="Sponsored by"><span class="sponsor">BION Management</span></td>
              <td data-label="Reference">No bill uploaded</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="shuttle-note"><strong>Shuttle cost note:</strong> The bill lists 5 tubes × ₹1,095 = ₹5,475. Only 2 tubes were used for SportsFest, so ₹2,190 is counted; the remaining ₹3,285 is excluded.</p>
    </section>

    <section class="finance-section" aria-labelledby="bills-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Source documents</p>
          <h2 id="bills-title">Bill references</h2>
        </div>
        <p>Previews are cropped to the relevant line items and totals.</p>
      </div>

      <div class="bill-grid">
        <figure class="bill-card">
          <a href="img/financials/sachdev-sports-items.webp" target="_blank" rel="noopener" aria-label="Open Sachdev Sports items bill preview">
            <img src="img/financials/sachdev-sports-items.webp" alt="Sachdev Sports bill lines for shuttle tubes, tennis balls, tennikoit rings, table tennis balls and squash ball" loading="lazy" decoding="async">
          </a>
          <figcaption>
            <p class="eyebrow">Sachdev Sports · 1 Aug 2026</p>
            <h3>Sports items bill</h3>
            <p>Bill S/20504/E4/08/26 · Billed total ₹6,967.00. The event statement applies the two-tube shuttle adjustment.</p>
          </figcaption>
        </figure>

        <figure class="bill-card">
          <a href="img/financials/medals-bill.webp" target="_blank" rel="noopener" aria-label="Open medals bill preview">
            <img src="img/financials/medals-bill.webp" alt="Sachdev Sports bill line for 130 medals at 34 rupees each" loading="lazy" decoding="async">
          </a>
          <figcaption>
            <p class="eyebrow">Sachdev Sports · 11 Aug 2026</p>
            <h3>Medals bill</h3>
            <p>Bill S/22031/E4/08/26 · 130 medals at ₹34 each, total ₹4,420.00.</p>
          </figcaption>
        </figure>

        <figure class="bill-card">
          <a href="img/financials/zepto-carrom-set.webp" target="_blank" rel="noopener" aria-label="Open Zepto carrom set invoice preview">
            <img src="img/financials/zepto-carrom-set.webp" alt="Zepto invoice line for a carrom coin, striker and powder set totaling 192 rupees" loading="lazy" decoding="async">
          </a>
          <figcaption>
            <p class="eyebrow">Zepto · 1 Aug 2026</p>
            <h3>Carrom set invoice</h3>
            <p>Invoice 260836G000194165 · Carrom coin, striker and powder set, total ₹192.00.</p>
          </figcaption>
        </figure>
      </div>

    </section>
  </template>

  <footer class="foot">
    <div class="wrap">
      <p class="legend">
        <span><i class="pip"></i> Champion</span>
        <span><i class="pip silver"></i> Runner-up</span>
      </p>
      <p><strong>Medals will be distributed on or before 15 August</strong>, by the Independence Day celebrations.</p>
      <p>Events that did not reach minimum registrations were not held.</p>
    </div>
  </footer>

  <script src="js/sportsfest.js"></script>
</body>
</html>
